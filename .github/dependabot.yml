version: 2
updates:
  # Reviewers come from .github/CODEOWNERS (the `reviewers` option is deprecated)

  # Enable version updates for npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    assignees:
      - 'eugenehp'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      prefix-scope: 'deps'
      include: 'scope'
    allow:
      - dependency-type: 'all'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:30'
    assignees:
      - 'eugenehp'
    labels:
      - 'ci/cd'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      prefix-scope: 'actions'
      include: 'scope'
